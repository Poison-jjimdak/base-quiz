<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>진법 변환 퀴즈</title>

    <!-- Material Symbols + Roboto -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet"
    >

    <!-- 색상 / 디자인 -->
    <link rel="stylesheet" href="theme.css">

    <!-- 레이아웃 / 컴포넌트 -->
    <link rel="stylesheet" href="style.css">

    <style>
    #settingsContainer {
        display: none;
    }

    #settingsContainer.settings-open {
        display: block;
    }
</style>
</head>


<body>

    <!-- =====================================================
         QUIZ
         ===================================================== -->

    <main class="app">

        <section class="quiz-card">

            <!-- 상단 -->
            <header class="header">

                <div class="title">

                    <div class="title-icon">
                        <span class="material-symbols-rounded">
                            calculate
                        </span>
                    </div>

                    <span>진법 변환 퀴즈</span>

                </div>


                <div
                    class="score"
                    id="score"
                >
                    0 / 0
                </div>

            </header>


            <!-- 문제 -->
            <div
                class="question"
                id="question"
            >
                101101<sub>2</sub> → ?<sub>16</sub>
            </div>


            <!-- 답 입력 -->
            <div class="answer-area">

                <input
                    id="answerInput"
                    class="answer-input"
                    type="text"
                    inputmode="text"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                    placeholder="정답 입력"
                    aria-label="답 입력"
                >


                <button
                    id="submitButton"
                    class="submit-button"
                    type="button"
                >
                    제출
                </button>

            </div>


            <!-- 결과 -->
            <div
                id="result"
                class="result"
                aria-live="polite"
            ></div>


            <!-- 최근 기록 -->
            <section class="history">

                <div class="history-title">
                    최근 기록
                </div>

                <div
                    id="historyList"
                    class="history-list"
                ></div>

            </section>

        </section>

    </main>



    <!-- =====================================================
         SETTINGS FAB
         오른쪽 아래 설정 버튼
         ===================================================== -->

    <button
        id="settingsFab"
        class="settings-fab"
        type="button"
        aria-label="설정"
        aria-haspopup="dialog"
    >

        <span class="material-symbols-rounded">
            settings
        </span>

    </button>



    <!-- =====================================================
         SETTINGS BOTTOM SHEET
         ===================================================== -->

    <div id="settingsContainer">


        <!-- 배경 눌러도 닫힘 -->
        <div
            id="settingsBackdrop"
            class="settings-backdrop"
        ></div>


        <section
            id="settingsSheet"
            class="settings-sheet"
            role="dialog"
            aria-modal="true"
            aria-label="설정"
        >

            <!-- 위에 있는 작은 손잡이 -->
            <div class="sheet-handle"></div>


            <!-- =================================================
                 SETTINGS MAIN
                 ================================================= -->

            <div
                id="settingsMain"
                class="settings-main"
            >


                <!-- 진법 -->

                <div class="settings-group">

                    <div class="settings-group-title">
                        진법
                    </div>


                    <!-- 입력 진법 -->

                    <button
                        id="inputBaseSetting"
                        class="settings-item"
                        type="button"
                    >

                        <div class="settings-item-icon">

                            <span class="material-symbols-rounded">
                                input
                            </span>

                        </div>


                        <div class="settings-item-content">

                            <div class="settings-item-title">
                                입력 진법
                            </div>

                            <div
                                id="inputBaseSummary"
                                class="settings-item-summary"
                            >
                                2진수
                            </div>

                        </div>


                        <span class="material-symbols-rounded settings-chevron">
                            chevron_right
                        </span>

                    </button>


                    <!-- 출력 진법 -->

                    <button
                        id="outputBaseSetting"
                        class="settings-item"
                        type="button"
                    >

                        <div class="settings-item-icon">

                            <span class="material-symbols-rounded">
                                output
                            </span>

                        </div>


                        <div class="settings-item-content">

                            <div class="settings-item-title">
                                출력 진법
                            </div>

                            <div
                                id="outputBaseSummary"
                                class="settings-item-summary"
                            >
                                10진수
                            </div>

                        </div>


                        <span class="material-symbols-rounded settings-chevron">
                            chevron_right
                        </span>

                    </button>

                </div>



                <!-- 화면 -->

                <div class="settings-group">

                    <div class="settings-group-title">
                        화면
                    </div>


                    <!-- 테마 -->

                    <button
                        id="themeSetting"
                        class="settings-item"
                        type="button"
                    >

                        <div class="settings-item-icon">

                            <span class="material-symbols-rounded">
                                dark_mode
                            </span>

                        </div>


                        <div class="settings-item-content">

                            <div class="settings-item-title">
                                테마
                            </div>

                            <div
                                id="themeSummary"
                                class="settings-item-summary"
                            >
                                라이트
                            </div>

                        </div>


                        <span class="material-symbols-rounded settings-chevron">
                            chevron_right
                        </span>

                    </button>

                </div>



                <!-- 기타 -->

                <div class="settings-group">

                    <div class="settings-group-title">
                        기타
                    </div>


                    <!-- GitHub -->

                    <button
                        id="githubButton"
                        class="settings-item"
                        type="button"
                    >

                        <div class="settings-item-icon">

                            <span class="material-symbols-rounded">
                                code
                            </span>

                        </div>


                        <div class="settings-item-content">

                            <div class="settings-item-title">
                                GitHub
                            </div>

                            <div class="settings-item-summary">
                                프로젝트 소스 코드
                            </div>

                        </div>


                        <span class="material-symbols-rounded">
                            open_in_new
                        </span>

                    </button>

                </div>

            </div>



            <!-- =================================================
                 INPUT BASE SCREEN
                 ================================================= -->

            <div
                id="inputBaseScreen"
                class="settings-subscreen"
            >

                <div class="subscreen-header">

                    <button
                        id="inputBaseBack"
                        class="icon-button"
                        type="button"
                        aria-label="뒤로"
                    >

                        <span class="material-symbols-rounded">
                            arrow_back
                        </span>

                    </button>


                    <div class="subscreen-header-text">

                        <h2>입력 진법</h2>

                        <p>
                            문제에 표시되는 숫자의 진법
                        </p>

                    </div>

                </div>


                <!-- 여기서 여러 개 선택 가능 -->

                <div
                    id="inputBaseChips"
                    class="chip-group"
                >

                    <button
                        class="filter-chip"
                        type="button"
                        data-base="2"
                    >

                        <span class="check material-symbols-rounded">
                            check
                        </span>

                        2진수

                    </button>


                    <button
                        class="filter-chip"
                        type="button"
                        data-base="8"
                    >

                        <span class="check material-symbols-rounded">
                            check
                        </span>

                        8진수

                    </button>


                    <button
                        class="filter-chip"
                        type="button"
                        data-base="10"
                    >

                        <span class="check material-symbols-rounded">
                            check
                        </span>

                        10진수

                    </button>


                    <button
                        class="filter-chip"
                        type="button"
                        data-base="16"
                    >

                        <span class="check material-symbols-rounded">
                            check
                        </span>

                        16진수

                    </button>

                </div>

            </div>



            <!-- =================================================
                 OUTPUT BASE SCREEN
                 ================================================= -->

            <div
                id="outputBaseScreen"
                class="settings-subscreen"
            >

                <div class="subscreen-header">

                    <button
                        id="outputBaseBack"
                        class="icon-button"
                        type="button"
                        aria-label="뒤로"
                    >

                        <span class="material-symbols-rounded">
                            arrow_back
                        </span>

                    </button>


                    <div class="subscreen-header-text">

                        <h2>출력 진법</h2>

                        <p>
                            정답을 입력할 진법
                        </p>

                    </div>

                </div>


                <div
                    id="outputBaseChips"
                    class="chip-group"
                >

                    <button
                        class="filter-chip"
                        type="button"
                        data-base="2"
                    >

                        <span class="check material-symbols-rounded">
                            check
                        </span>

                        2진수

                    </button>


                    <button
                        class="filter-chip"
                        type="button"
                        data-base="8"
                    >

                        <span class="check material-symbols-rounded">
                            check
                        </span>

                        8진수

                    </button>


                    <button
                        class="filter-chip"
                        type="button"
                        data-base="10"
                    >

                        <span class="check material-symbols-rounded">
                            check
                        </span>

                        10진수

                    </button>


                    <button
                        class="filter-chip"
                        type="button"
                        data-base="16"
                    >

                        <span class="check material-symbols-rounded">
                            check
                        </span>

                        16진수

                    </button>

                </div>

            </div>



            <!-- =================================================
                 THEME SCREEN
                 ================================================= -->

            <div
                id="themeScreen"
                class="settings-subscreen"
            >

                <div class="subscreen-header">

                    <button
                        id="themeBack"
                        class="icon-button"
                        type="button"
                        aria-label="뒤로"
                    >

                        <span class="material-symbols-rounded">
                            arrow_back
                        </span>

                    </button>


                    <div class="subscreen-header-text">

                        <h2>테마</h2>

                        <p>
                            앱의 화면 테마를 선택해주세요
                        </p>

                    </div>

                </div>


                <!-- 테마 선택 -->

                <div class="choice-list">


                    <!-- 라이트 -->

                    <button
                        class="choice-item"
                        type="button"
                        data-theme-choice="light"
                    >

                        <span>
                            라이트
                        </span>

                        <span class="check material-symbols-rounded">
                            check
                        </span>

                    </button>


                    <!-- 다크 -->

                    <button
                        class="choice-item"
                        type="button"
                        data-theme-choice="dark"
                    >

                        <span>
                            다크
                        </span>

                        <span class="check material-symbols-rounded">
                            check
                        </span>

                    </button>


                    <!-- 기기 설정 -->

                    <button
                        class="choice-item"
                        type="button"
                        data-theme-choice="system"
                    >

                        <span>
                            기기 설정
                        </span>

                        <span class="check material-symbols-rounded">
                            check
                        </span>

                    </button>

                </div>

            </div>

        </section>

    </div>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="script.js"></script>

</body>
</html>
