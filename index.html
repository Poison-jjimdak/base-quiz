<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진법 변환 퀴즈</title>

<<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                     "Pretendard", sans-serif;
        background:
            radial-gradient(circle at top left, rgba(90, 120, 255, 0.25), transparent 35%),
            radial-gradient(circle at bottom right, rgba(170, 90, 255, 0.18), transparent 35%),
            #1c1c1e;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: #f5f5f7;
    }

    .quiz-container {
        width: 100%;
        max-width: 600px;
        padding: 28px;
        border-radius: 28px;

        background: rgba(44, 44, 46, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
            0 20px 60px rgba(0, 0, 0, 0.35),
            inset 0 1px 0 rgba(255, 255, 255, 0.08);

        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
    }

    h1 {
        text-align: center;
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: #ffffff;
    }

    .score {
        text-align: center;
        color: #98989d;
        font-size: 14px;
        margin-bottom: 24px;
    }

    .question {
        background: rgba(58, 58, 60, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 22px;
        padding: 28px 20px;
        text-align: center;
        margin-bottom: 18px;
    }

    .question p {
        color: #98989d;
        margin: 0 0 8px;
        font-size: 15px;
    }

    .question .conversion {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: #ffffff;
        margin: 12px 0 4px;
    }

    .badge {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: #b0b0b5;
        font-size: 13px;
        margin-bottom: 8px;
    }

    input {
        width: 100%;
        padding: 16px;
        font-size: 22px;
        font-family: inherit;
        text-align: center;

        color: #ffffff;
        background: rgba(28, 28, 30, 0.75);

        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 15px;
        outline: none;

        transition: 0.2s ease;
    }

    input::placeholder {
        color: #636366;
    }

    input:focus {
        border-color: rgba(120, 140, 255, 0.8);
        background: rgba(28, 28, 30, 0.9);
        box-shadow: 0 0 0 4px rgba(100, 120, 255, 0.12);
    }

    button {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 15px;

        font-family: inherit;
        font-size: 17px;
        font-weight: 600;

        cursor: pointer;
        margin-top: 10px;

        transition:
            transform 0.15s ease,
            opacity 0.15s ease,
            background 0.2s ease;
    }

    button:active {
        transform: scale(0.98);
    }

    #submitBtn {
        background: #ffffff;
        color: #1c1c1e;
    }

    #submitBtn:hover {
        background: #e5e5ea;
    }

    #nextBtn {
        background: rgba(72, 187, 120, 0.9);
        color: white;
        display: none;
    }

    #nextBtn:hover {
        background: rgba(72, 187, 120, 1);
    }

    .result {
        text-align: center;
        font-size: 16px;
        font-weight: 600;
        margin: 16px 0;
        min-height: 24px;
    }

    .correct {
        color: #30d158;
    }

    .wrong {
        color: #ff453a;
    }

    .history {
        margin-top: 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-top: 18px;
    }

    .history-title {
        font-size: 15px;
        font-weight: 600;
        color: #f5f5f7;
        margin-bottom: 10px;
    }

    .history-item {
        padding: 9px 12px;
        border-radius: 11px;
        margin-bottom: 6px;
        font-size: 14px;
        background: rgba(255, 255, 255, 0.05);
    }

    .history-item.correct {
        background: rgba(48, 209, 88, 0.10);
    }

    .history-item.wrong {
        background: rgba(255, 69, 58, 0.10);
    }

    @media (max-width: 500px) {
        body {
            padding: 14px;
        }

        .quiz-container {
            padding: 22px;
            border-radius: 24px;
        }

        h1 {
            font-size: 25px;
        }

        .question .conversion {
            font-size: 27px;
        }
    }
</style></head>

<body>

<div class="quiz-container">

    <h1>🔢 진법 변환 퀴즈</h1>

    <div class="score">
        점수: <strong id="score">0</strong> /
        <strong id="total">0</strong>
    </div>

    <div class="question">
        <span class="badge" id="questionNumber">문제 1</span>

        <p>다음 수를 변환하세요.</p>

        <div class="conversion" id="questionText">
            1010₂ → 10진수
        </div>

        <input
            type="text"
            id="answer"
            placeholder="정답 입력"
            autocomplete="off"
        >
    </div>

    <div class="result" id="result"></div>

    <button id="submitBtn">정답 확인</button>
    <button id="nextBtn">다음 문제 →</button>

    <div class="history">
        <div class="history-title">📋 풀이 기록</div>
        <div id="historyList"></div>
    </div>

</div>

<script>
    const BASES = {
        2: "2진수",
        8: "8진수",
        16: "16진수"
    };

    let currentQuestion;
    let score = 0;
    let total = 0;

    const questionText = document.getElementById("questionText");
    const questionNumber = document.getElementById("questionNumber");
    const answerInput = document.getElementById("answer");
    const result = document.getElementById("result");
    const scoreElement = document.getElementById("score");
    const totalElement = document.getElementById("total");
    const historyList = document.getElementById("historyList");

    const submitBtn = document.getElementById("submitBtn");
    const nextBtn = document.getElementById("nextBtn");


    // 10진수 → 2/8/16진수 문제 생성
    function generateQuestion() {

        const targetBases = [2, 8, 16];

        const targetBase =
            targetBases[Math.floor(Math.random() * targetBases.length)];

        // 1 ~ 255 사이의 10진수
        const decimalNumber =
            Math.floor(Math.random() * 255) + 1;

        const correctAnswer =
            decimalNumber.toString(targetBase).toUpperCase();

        currentQuestion = {
            decimalNumber,
            targetBase,
            correctAnswer
        };

        questionNumber.textContent =
            `문제 ${total + 1}`;

        questionText.textContent =
            `${decimalNumber}₁₀ → ${BASES[targetBase]}`;

        answerInput.value = "";
        answerInput.disabled = false;

        result.textContent = "";
        result.className = "result";

        submitBtn.style.display = "block";
        nextBtn.style.display = "none";

        answerInput.focus();
    }


    // 정답 확인
    function checkAnswer() {

        const userAnswer =
            answerInput.value.trim().toUpperCase();

        if (!userAnswer) {
            result.textContent = "정답을 입력해주세요.";
            result.className = "result wrong";
            return;
        }

        total++;

        if (userAnswer === currentQuestion.correctAnswer) {

            score++;

            result.textContent = "🎉 정답!";
            result.className = "result correct";

            addHistory(
                true,
                `${currentQuestion.decimalNumber}₁₀ → ` +
                `${currentQuestion.correctAnswer}${getSubscript(currentQuestion.targetBase)}`
            );

        } else {

            result.textContent =
                `❌ 오답! 정답: ${currentQuestion.correctAnswer}`;

            result.className = "result wrong";

            addHistory(
                false,
                `${currentQuestion.decimalNumber}₁₀ → ` +
                `입력: ${userAnswer} / 정답: ${currentQuestion.correctAnswer}`
            );
        }

        scoreElement.textContent = score;
        totalElement.textContent = total;

        answerInput.disabled = true;
        submitBtn.style.display = "none";
        nextBtn.style.display = "block";
    }


    // 진법 아래첨자
    function getSubscript(base) {
        const subscript = {
            2: "₂",
            8: "₈",
            16: "₁₆"
        };

        return subscript[base];
    }


    // 풀이 기록
    function addHistory(isCorrect, text) {

        const item = document.createElement("div");

        item.className =
            `history-item ${isCorrect ? "correct" : "wrong"}`;

        item.textContent =
            `${isCorrect ? "⭕" : "❌"} ${text}`;

        historyList.prepend(item);

        while (historyList.children.length > 10) {
            historyList.removeChild(historyList.lastChild);
        }
    }


    submitBtn.addEventListener("click", checkAnswer);

    nextBtn.addEventListener("click", generateQuestion);


    // Enter 키
    answerInput.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            if (answerInput.disabled) {
                generateQuestion();
            } else {
                checkAnswer();
            }

        }

    });


    // 첫 문제
    generateQuestion();
</script>


</body>
</html>
